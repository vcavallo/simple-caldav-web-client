services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      # Optional: override passwords without putting them in config.yaml
      # - CALDAV_CAL_0_PASSWORD=...
      - CALDAV_CONFIG=/app/config.yaml
    restart: unless-stopped
