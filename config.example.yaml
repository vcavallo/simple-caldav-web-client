# Copy to config.yaml (gitignored) and edit with your Baikal credentials.
#
# Each calendar's `id` is optional; if omitted it is derived from the name
# (lowercased, alphanumerics only).
#
# Password resolution per calendar, highest precedence first:
#   1. CALDAV_CAL_<n>_PASSWORD env var (n = list order, starting at 0)
#   2. password_file: path to a file holding the password (newline stripped;
#      ~ is expanded). Keeps the secret out of this file.
#   3. password: inline plaintext

calendars:
  - name: "Personal"
    url: "https://baikal.yourdomain.tld/dav.php/calendars/user/personal/"
    username: "user"
    password_file: "~/.baikal_password"
    color: "#4A90D9"

  - name: "Yellow House"
    url: "https://baikal.yourdomain.tld/dav.php/calendars/user/yellowhouse/"
    username: "user"
    password_file: "~/.baikal_password"
    color: "#F5A623"

  - name: "Corner Bar"
    url: "https://baikal.yourdomain.tld/dav.php/calendars/user/cornerbar/"
    username: "user"
    password: "or-inline-if-you-prefer"
    color: "#7ED321"
